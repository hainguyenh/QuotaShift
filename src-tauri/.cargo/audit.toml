[advisories]
ignore = [
    # RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g
    # Unsoundness in glib::VariantStrIter for published glib >= 0.15.0, < 0.20.0.
    #
    # Tauri 2's Linux GTK3 graph still requires the glib 0.18 API. Cargo.toml
    # therefore patches glib to the source-compatible 0.18.5 backport at the
    # immutable backport commit:
    # 9e2bb20e2daba5b4dc5e2c9f4dee0797a1503b9f
    # https://github.com/andrew-wommack-ministries/glib-rustsec-2024-0429-backport
    #
    # That commit applies only the upstream gtk-rs-core#1343 fix in
    # VariantStrIter::impl_get: the C out-parameter is passed as &mut p instead
    # of &p. No public API changes are introduced.
    #
    # cargo-audit / RustSec is a version-based scanner. The patched source must
    # retain version 0.18.5 for GTK3 semver compatibility, so it still matches
    # the advisory range even though the vulnerable code has been replaced.
    # Keep this narrowly-scoped ignore until Tauri's GTK stack can use a
    # published glib >= 0.20 release.
    #
    # Upstream fix: https://github.com/gtk-rs/gtk-rs-core/pull/1343
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2024-0429.html
    "RUSTSEC-2024-0429",
]
